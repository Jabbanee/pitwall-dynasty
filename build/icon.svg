<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#c8102e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c64a"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
  </defs>
  <!-- Rounded dark background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Checkered flag band on the left -->
  <g transform="translate(20 56)">
    <rect x="0" y="0" width="8" height="8" fill="#f0c64a"/>
    <rect x="8" y="0" width="8" height="8" fill="#0a0c12"/>
    <rect x="16" y="0" width="8" height="8" fill="#f0c64a"/>
    <rect x="24" y="0" width="8" height="8" fill="#0a0c12"/>
    <rect x="32" y="0" width="8" height="8" fill="#f0c64a"/>
    <rect x="0" y="8" width="8" height="8" fill="#0a0c12"/>
    <rect x="8" y="8" width="8" height="8" fill="#f0c64a"/>
    <rect x="16" y="8" width="8" height="8" fill="#0a0c12"/>
    <rect x="24" y="8" width="8" height="8" fill="#f0c64a"/>
    <rect x="32" y="8" width="8" height="8" fill="#0a0c12"/>
    <rect x="0" y="16" width="8" height="8" fill="#f0c64a"/>
    <rect x="8" y="16" width="8" height="8" fill="#0a0c12"/>
    <rect x="16" y="16" width="8" height="8" fill="#f0c64a"/>
    <rect x="24" y="16" width="8" height="8" fill="#0a0c12"/>
    <rect x="32" y="16" width="8" height="8" fill="#f0c64a"/>
    <rect x="0" y="24" width="8" height="8" fill="#0a0c12"/>
    <rect x="8" y="24" width="8" height="8" fill="#f0c64a"/>
    <rect x="16" y="24" width="8" height="8" fill="#0a0c12"/>
    <rect x="24" y="24" width="8" height="8" fill="#f0c64a"/>
    <rect x="32" y="24" width="8" height="8" fill="#0a0c12"/>
    <rect x="0" y="32" width="8" height="8" fill="#f0c64a"/>
    <rect x="8" y="32" width="8" height="8" fill="#0a0c12"/>
    <rect x="16" y="32" width="8" height="8" fill="#f0c64a"/>
    <rect x="24" y="32" width="8" height="8" fill="#0a0c12"/>
    <rect x="32" y="32" width="8" height="8" fill="#f0c64a"/>
  </g>
  <!-- Red PD shield -->
  <g transform="translate(86 56)">
    <path d="M0 0 H84 V68 Q84 100 42 130 Q0 100 0 68 Z" fill="url(#red)"/>
    <path d="M6 6 H78 V66 Q78 92 42 118 Q6 92 6 66 Z" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    <!-- PD monogram -->
    <text x="42" y="78" text-anchor="middle" font-family="Rajdhani, Inter, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-2">PD</text>
  </g>
  <!-- Gold underline -->
  <rect x="86" y="196" width="84" height="6" fill="url(#gold)" rx="2"/>
  <!-- BaneWorks microtext -->
  <text x="128" y="220" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.55)" letter-spacing="3">BANEWORKS</text>
</svg>
